  - generic [ref=e260]:
    - text: Each language measures its own curve from its own committed evidence and publishes it as
    - code [ref=e261]: status.json
    - text: ". A solid line ships. A dashed one does not, and the table says which kind: held is a decision somebody made and wrote down, pending is a language nobody has decided about yet. This page reads those files from each repository's main branch, so it is as current as the repositories are. Nothing here is authoritative: if this disagrees with a language repository, the language repository is right."